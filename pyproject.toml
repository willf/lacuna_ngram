[project]
name = "lacuna"
version = "0.1.0"
description = "Fill your gaps with Lacuna"
authors = [
  { name = "Will Fitzgerald", email = "willf@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "nltk>=3.8.1,<4.0.0",
  "transformers>=4.37.2,<5.0.0",
  "torch>=2.2.0,<3.0.0",
  "betacode>=1.0,<2.0",
  "pygtrie>=2.5.0,<3.0.0",
  "greek-utils>=0.2,<1.0",
]

[dependency-groups]
dev = [
  "black>=24.2.0,<25.0.0",
  "flake8>=7.0.0,<8.0.0",
  "pytest>=8.0.0,<9.0.0",
  "isort>=5.13.2,<6.0.0",
  "coverage>=7.4.1,<8.0.0",
  "ipython>=8.21.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
